<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語学習アプリ Ver0.4</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 360px;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .mode-label {
      font-size: 0.85rem;
      color: #888;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .primary-text {
      font-size: 2.2rem;
      font-weight: bold;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.2;
    }
    .secondary-text {
      font-size: 1.5rem;
      color: #007bff;
      min-height: 2.2rem;
      line-height: 1.2;
    }
    button {
      margin-top: 30px;
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="mode" class="mode-label">スタートボタンを押してください</div>
    <div id="primary" class="primary-text">英単語アプリ (100語)</div>
    <div id="secondary" class="secondary-text"></div>
    <button id="startBtn" onclick="startApp()">学習を開始する</button>
  </div>

  <script>
    const wordList = [
      { en: "one", ja: "1つの、1人の" },
      { en: "the", ja: "その" },
      { en: "you", ja: "あなたは" },
      { en: "my", ja: "私の" },
      { en: "father", ja: "父" },
      { en: "do", ja: "する" },
      { en: "your", ja: "あなたの" },
      { en: "in", ja: "中に" },
      { en: "read", ja: "読む" },
      { en: "he", ja: "彼は" },
      { en: "see", ja: "見る、わかる" },
      { en: "it", ja: "それは" },
      { en: "mother", ja: "母" },
      { en: "name", ja: "名前" },
      { en: "like", ja: "好む" },
      { en: "how", ja: "どのぐらい" },
      { en: "school", ja: "学校" },
      { en: "January", ja: "1月" },
      { en: "all", ja: "全部、全員、全て、みな" },
      { en: "old", ja: "古い" },
      { en: "fruit", ja: "果物" },
      { en: "speak", ja: "話す" },
      { en: "where", ja: "どこに" },
      { en: "long", ja: "長い" },
      { en: "study", ja: "勉強する" },
      { en: "chair", ja: "いす" },
      { en: "very", ja: "非常に" },
      { en: "I", ja: "私は" },
      { en: "our", ja: "私たちの" },
      { en: "year", ja: "年" },
      { en: "when", ja: "いつ" },
      { en: "a lot of", ja: "たくさんの" },
      { en: "nice", ja: "良い" },
      { en: "sing", ja: "歌う" },
      { en: "fine", ja: "元気な" },
      { en: "right", ja: "右" },
      { en: "want", ja: "欲しい" },
      { en: "red", ja: "赤い" },
      { en: "much", ja: "たくさん" },
      { en: "here", ja: "ここに" },
      { en: "July", ja: "7月" },
      { en: "cold", ja: "冷たい" },
      { en: "write", ja: "書く、手紙を書く" },
      { en: "station", ja: "駅" },
      { en: "color", ja: "色" },
      { en: "this", ja: "この" },
      { en: "she", ja: "彼女は" },
      { en: "look", ja: "見る" },
      { en: "many", ja: "多くの" },
      { en: "two", ja: "2" },
      { en: "teacher", ja: "先生" },
      { en: "morning", ja: "朝" },
      { en: "use", ja: "使う" },
      { en: "run", ja: "走る" },
      { en: "hungry", ja: "空腹の" },
      { en: "fish", ja: "魚" },
      { en: "lunch", ja: "昼食" },
      { en: "have", ja: "持っている" },
      { en: "eat", ja: "食べる" },
      { en: "know", ja: "知っている" },
      { en: "usually", ja: "普通は" },
      { en: "season", ja: "季節" },
      { en: "book", ja: "本" },
      { en: "winter", ja: "冬" },
      { en: "stop", ja: "止める" },
      { en: "three", ja: "3" },
      { en: "pencil", ja: "鉛筆" },
      { en: "please", ja: "どうぞ" },
      { en: "wall", ja: "壁" },
      { en: "meet", ja: "会う" },
      { en: "May", ja: "5月" },
      { en: "ride", ja: "乗る" },
      { en: "six", ja: "6" },
      { en: "always", ja: "いつも" },
      { en: "drink", ja: "飲む" },
      { en: "four", ja: "4" },
      { en: "sister", ja: "姉妹" },
      { en: "hospital", ja: "病院" },
      { en: "park", ja: "公園" },
      { en: "baseball", ja: "野球" },
      { en: "wash", ja: "洗う" },
      { en: "cake", ja: "ケーキ" },
      { en: "bag", ja: "カバン" },
      { en: "Tuesday", ja: "火曜日" },
      { en: "try", ja: "試す" },
      { en: "cook", ja: "料理する" },
      { en: "watch", ja: "見る" },
      { en: "nurse", ja: "看護婦" },
      { en: "five", ja: "5" },
      { en: "seventeen", ja: "17" },
      { en: "table", ja: "つくえ" },
      { en: "place", ja: "場所" },
      { en: "cup", ja: "カップ" },
      { en: "green", ja: "緑" },
      { en: "we", ja: "私たちは" },
      { en: "fifty", ja: "50" },
      { en: "eleven", ja: "11" },
      { en: "picture", ja: "絵、写真" },
      { en: "happy", ja: "幸福な" },
      { en: "Thursday", ja: "木曜日" }
    ];

    let currentTimeout = null;
    let isRunning = false;
    // 使い回すAudio要素を事前生成
    const audioPlayer = new Audio();

    function speak(text) {
      if (!text) return;
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
      audioPlayer.src = url;
      audioPlayer.play().catch(e => console.log("再生エラー:", e));
    }

    function getRandomItem(array) {
      return array[Math.floor(Math.random() * array.length)];
    }

    function startApp() {
      // ボタンタップのタイミングで空音声(ダミー)を再生し、スマホのオーディオ再生制限を解除する
      audioPlayer.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
      audioPlayer.play().then(() => {
        document.getElementById("startBtn").style.display = "none";
        isRunning = true;
        nextQuestion();
      }).catch(e => {
        // 解除失敗時も学習をスタート
        document.getElementById("startBtn").style.display = "none";
        isRunning = true;
        nextQuestion();
      });
    }

    function nextQuestion() {
      if (!isRunning) return;

      const primaryEl = document.getElementById("primary");
      const secondaryEl = document.getElementById("secondary");
      const modeEl = document.getElementById("mode");

      secondaryEl.textContent = "";

      const item = getRandomItem(wordList);
      const mode = Math.random() < 0.5 ? 1 : 2;

      if (mode === 1) {
        modeEl.textContent = "英 ➔ 日";
        primaryEl.textContent = item.en;

        currentTimeout = setTimeout(() => {
          speak(item.en);
          secondaryEl.textContent = item.ja;
          currentTimeout = setTimeout(nextQuestion, 3000);
        }, 2000);

      } else {
        modeEl.textContent = "日 ➔ 英";
        primaryEl.textContent = item.ja;

        currentTimeout = setTimeout(() => {
          secondaryEl.textContent = item.en;
          speak(item.en);
          currentTimeout = setTimeout(nextQuestion, 3000);
        }, 2000);
      }
    }
  </script>
</body>
</html>
