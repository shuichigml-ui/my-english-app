<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語学習アプリ（2026年夏休み宿題）Ver.0.73</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 360px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }
    .mode-label {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .primary-text {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.2;
      word-break: break-word;
    }
    .secondary-text {
      font-size: 1.5rem;
      min-height: 2.2rem;
      line-height: 1.2;
      word-break: break-word;
    }

    /* 「解答表示時」の英単語拡大クラス */
    .secondary-text.large-word {
      font-size: 2.8rem;
      font-weight: bold;
    }
    
    /* 色分け用クラス */
    .color-blue {
      color: #007bff !important; /* 英単語：青 */
    }
    .color-red {
      color: #d9534f !important; /* 指示：赤 */
      font-weight: bold;
    }
    .color-black {
      color: #222222 !important; /* それ以外（日本語・繁体字の意味等）：黒 */
    }

    .notice-text {
      font-size: 0.8rem;
      color: #d9534f;
      margin-top: 15px;
      line-height: 1.4;
    }
    .option-group {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      font-size: 0.95rem;
      color: #222;
      width: 100%;
      background: #f8f9fa;
      padding: 12px 15px;
      border-radius: 8px;
      box-sizing: border-box;
    }
    .option-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .option-group input[type="checkbox"],
    .option-group input[type="radio"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .btn-group {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 36px;
      font-size: 1.1rem;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #ccc;
      color: #888;
      cursor: not-allowed;
    }

    /* スタートへ戻るリンク */
    .back-home-link {
      margin-top: 20px;
      font-size: 0.9rem;
      color: #6c757d;
      text-decoration: underline;
      cursor: pointer;
    }
    .back-home-link:hover {
      color: #343a40;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="mode" class="mode-label">スタートボタンを押してください</div>
    <div id="primary" class="primary-text color-black">英単語学習アプリ（2026年夏休み宿題）Ver.0.73</div>
    <div id="secondary" class="secondary-text"></div>
    
    <div id="optionArea">
      <div class="option-group">
        <div id="lblLangSelect"><strong>言語選択:</strong></div>
        <label>
          <input type="radio" name="langMode" value="ja" checked onchange="updateUIByLanguage()">
          <span id="lblOptJa">日本語 ⇔ 英語（英日・日英）</span>
        </label>
        <label>
          <input type="radio" name="langMode" value="zh-TW" onchange="updateUIByLanguage()">
          <span id="lblOptTw">繁體中文 ⇔ 英語（台英・英台）</span>
        </label>
        <hr style="border: 0; border-top: 1px solid #ddd; width: 100%; margin: 5px 0;">
        <label>
          <input type="checkbox" id="spellCheckOption" checked>
          <span id="lblSpellCheck">綴り（スペル）の音声で確認する</span>
        </label>
      </div>
      <div id="noticeText" class="notice-text">※ Android Chrome でのみ動作確認を行っています。</div>
    </div>

    <div class="btn-group">
      <button id="startBtn" onclick="startApp()">スタート</button>
      <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>次へ ➔</button>
    </div>

    <!-- 最下部リンク -->
    <div id="backHomeBtn" class="back-home-link" style="display: none;" onclick="resetToHome()">
      スタートへ戻る
    </div>
  </div>

  <script>
    // 100語の単語リスト（日本語および繁体字を保持）
    const wordList = [
      { en: "one", ja: "1つの、1人の", tw: "一個、一人" },
      { en: "the", ja: "その", tw: "那個" },
      { en: "you", ja: "あなたは", tw: "你、你們" },
      { en: "my", ja: "私の", tw: "我的" },
      { en: "father", ja: "父", tw: "父親" },
      { en: "do", ja: "する", tw: "做" },
      { en: "your", ja: "あなたの", tw: "你的、你們的" },
      { en: "in", ja: "中に", tw: "在...裡面" },
      { en: "read", ja: "読む", tw: "閱讀" },
      { en: "he", ja: "彼は", tw: "他" },
      { en: "see", ja: "見る、わかる", tw: "看見、明白" },
      { en: "it", ja: "それは", tw: "它" },
      { en: "mother", ja: "母", tw: "母親" },
      { en: "name", ja: "名前", tw: "名字" },
      { en: "like", ja: "好む", tw: "喜歡" },
      { en: "how", ja: "どのぐらい", tw: "如何、多少" },
      { en: "school", ja: "学校", tw: "學校" },
      { en: "January", ja: "1月", tw: "一月" },
      { en: "all", ja: "全部、全員、全て、みな", tw: "全部、大家" },
      { en: "old", ja: "古い", tw: "老的、舊的" },
      { en: "fruit", ja: "果物", tw: "水果" },
      { en: "speak", ja: "話す", tw: "說話" },
      { en: "where", ja: "どこに", tw: "在哪裡" },
      { en: "long", ja: "長い", tw: "長的" },
      { en: "study", ja: "勉強する", tw: "學習、讀書" },
      { en: "chair", ja: "いす", tw: "椅子" },
      { en: "very", ja: "非常に", tw: "非常" },
      { en: "I", ja: "私は", tw: "我" },
      { en: "our", ja: "私たちの", tw: "我們的" },
      { en: "year", ja: "年", tw: "年" },
      { en: "when", ja: "いつ", tw: "什麼時候" },
      { en: "a lot of", ja: "たくさんの", tw: "許多的" },
      { en: "nice", ja: "良い", tw: "好的、美好的" },
      { en: "sing", ja: "歌う", tw: "唱歌" },
      { en: "fine", ja: "元気な", tw: "良好的、健康的" },
      { en: "right", ja: "右", tw: "右邊、正確的" },
      { en: "want", ja: "欲しい", tw: "想要" },
      { en: "red", ja: "赤い", tw: "紅色的" },
      { en: "much", ja: "たくさん", tw: "許多" },
      { en: "here", ja: "ここに", tw: "這裡" },
      { en: "July", ja: "7月", tw: "七月" },
      { en: "cold", ja: "冷たい", tw: "寒冷的、冷的" },
      { en: "write", ja: "書く、手紙を書く", tw: "寫字、寫信" },
      { en: "station", ja: "駅", tw: "車站" },
      { en: "color", ja: "色", tw: "顏色" },
      { en: "this", ja: "この", tw: "這個" },
      { en: "she", ja: "彼女は", tw: "她" },
      { en: "look", ja: "見る", tw: "看" },
      { en: "many", ja: "多くの", tw: "許多的" },
      { en: "two", ja: "2", tw: "二" },
      { en: "teacher", ja: "先生", tw: "老師" },
      { en: "morning", ja: "朝", tw: "早上" },
      { en: "use", ja: "使う", tw: "使用" },
      { en: "run", ja: "走る", tw: "跑步" },
      { en: "hungry", ja: "空腹の", tw: "飢餓的" },
      { en: "fish", ja: "魚", tw: "魚" },
      { en: "lunch", ja: "昼食", tw: "午餐" },
      { en: "have", ja: "持っている", tw: "有、擁有" },
      { en: "eat", ja: "食べる", tw: "吃" },
      { en: "know", ja: "知っている", tw: "知道、認識" },
      { en: "usually", ja: "普通は", tw: "通常" },
      { en: "season", ja: "季節", tw: "季節" },
      { en: "book", ja: "本", tw: "書本" },
      { en: "winter", ja: "冬", tw: "冬天" },
      { en: "stop", ja: "止める", tw: "停止" },
      { en: "three", ja: "3", tw: "三" },
      { en: "pencil", ja: "鉛筆", tw: "鉛筆" },
      { en: "please", ja: "どうぞ", tw: "請" },
      { en: "wall", ja: "壁", tw: "牆壁" },
      { en: "meet", ja: "会う", tw: "見面" },
      { en: "May", ja: "5月", tw: "五月" },
      { en: "ride", ja: "乗る", tw: "騎、乘" },
      { en: "six", ja: "6", tw: "六" },
      { en: "always", ja: "いつも", tw: "總是" },
      { en: "drink", ja: "飲む", tw: "喝" },
      { en: "four", ja: "4", tw: "四" },
      { en: "sister", ja: "姉妹", tw: "姐妹" },
      { en: "hospital", ja: "病院", tw: "醫院" },
      { en: "park", ja: "公園", tw: "公園" },
      { en: "baseball", ja: "野球", tw: "棒球" },
      { en: "wash", ja: "洗う", tw: "洗" },
      { en: "cake", ja: "ケーキ", tw: "蛋糕" },
      { en: "bag", ja: "カバン", tw: "包包" },
      { en: "Tuesday", ja: "火曜日", tw: "星期二" },
      { en: "try", ja: "試す", tw: "嘗試" },
      { en: "cook", ja: "料理する", tw: "烹調、做飯" },
      { en: "watch", ja: "見る", tw: "觀看" },
      { en: "nurse", ja: "看護婦", tw: "護士" },
      { en: "five", ja: "5", tw: "五" },
      { en: "seventeen", ja: "17", tw: "十七" },
      { en: "table", ja: "つくえ", tw: "桌子" },
      { en: "place", ja: "場所", tw: "地方、場所" },
      { en: "cup", ja: "カップ", tw: "杯子" },
      { en: "green", ja: "緑", tw: "綠色" },
      { en: "we", ja: "私たちは", tw: "我們" },
      { en: "fifty", ja: "50", tw: "五十" },
      { en: "eleven", ja: "11", tw: "十一" },
      { en: "picture", ja: "絵、写真", tw: "圖片、照片" },
      { en: "happy", ja: "幸福な", tw: "快樂的" },
      { en: "Thursday", ja: "木曜日", tw: "星期四" }
    ];

    let currentTimeout = null;
    let isSpellEnabled = true;
    let selectedLangMode = "ja";
    let wordQueue = [];
    let bestEnglishVoice = null;

    function updateUIByLanguage() {
      const radios = document.getElementsByName("langMode");
      for (const radio of radios) {
        if (radio.checked) {
          selectedLangMode = radio.value;
          break;
        }
      }

      if (selectedLangMode === "zh-TW") {
        document.getElementById("mode").textContent = "請按下開始按鈕";
        document.getElementById("primary").textContent = "英文單字學習 App (100字)Ver.0.73";
        document.getElementById("lblLangSelect").innerHTML = "<strong>語言選擇:</strong>";
        document.getElementById("lblOptJa").textContent = "日文 ⇔ 英文（英日・日英）";
        document.getElementById("lblOptTw").textContent = "繁體中文 ⇔ 英文（台英・英台）";
        document.getElementById("lblSpellCheck").textContent = "以拼音語音確認";
        document.getElementById("noticeText").textContent = "※ 僅在 Android Chrome 環境下完成測試。";
        document.getElementById("startBtn").textContent = "開始";
        document.getElementById("nextBtn").textContent = "下一題 ➔";
        document.getElementById("backHomeBtn").textContent = "返回首頁";
      } else {
        document.getElementById("mode").textContent = "スタートボタンを押してください";
        document.getElementById("primary").textContent = "英単語学習アプリ（2026年夏休み宿題）Ver.0.73";
        document.getElementById("lblLangSelect").innerHTML = "<strong>言語選択:</strong>";
        document.getElementById("lblOptJa").textContent = "日本語 ⇔ 英語（英日・日英）";
        document.getElementById("lblOptTw").textContent = "繁體中文 ⇔ 英語（台英・英台）";
        document.getElementById("lblSpellCheck").textContent = "綴り（スペル）の音声で確認する";
        document.getElementById("noticeText").textContent = "※ Android Chrome でのみ動作確認を行っています。";
        document.getElementById("startBtn").textContent = "スタート";
        document.getElementById("nextBtn").textContent = "次へ ➔";
        document.getElementById("backHomeBtn").textContent = "スタートへ戻る";
      }
    }

    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        bestEnglishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) ||
                           voices.find(v => v.lang.startsWith('en') && v.name.includes('Natural')) ||
                           voices.find(v => v.lang === 'en-US') ||
                           voices.find(v => v.lang.startsWith('en'));
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getNextWord() {
      if (wordQueue.length === 0) {
        wordQueue = shuffle(wordList);
      }
      return wordQueue.pop();
    }

    function setNextBtnEnabled(enabled) {
      document.getElementById("nextBtn").disabled = !enabled;
    }

    function clearAllTimers() {
      if (currentTimeout) {
        clearTimeout(currentTimeout);
        currentTimeout = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speakWord(text, onEnded) {
      playSingleAudio(text, onEnded);
    }

    function spellAndSpeak(word) {
      const cleanWord = word.replace(/[^a-zA-Z]/g, '');
      const letters = cleanWord.split('');

      if ('speechSynthesis' in window && letters.length > 0) {
        window.speechSynthesis.cancel();

        let index = 0;

        function speakNextLetter() {
          if (index < letters.length) {
            const letter = letters[index];
            index++;

            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            if (bestEnglishVoice) utterance.voice = bestEnglishVoice;

            utterance.onend = () => {
              currentTimeout = setTimeout(speakNextLetter, 100);
            };

            utterance.onerror = () => {
              currentTimeout = setTimeout(speakNextLetter, 100);
            };

            window.speechSynthesis.speak(utterance);

          } else {
            currentTimeout = setTimeout(() => {
              speakWord(word, () => {
                setNextBtnEnabled(true);
              });
            }, 1500);
          }
        }

        speakNextLetter();

      } else {
        speakWord(word, () => {
          setNextBtnEnabled(true);
        });
      }
    }

    function playSingleAudio(text, onEnded) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        if (bestEnglishVoice) utterance.voice = bestEnglishVoice;

        utterance.onend = () => {
          if (onEnded) onEnded();
        };

        utterance.onerror = () => {
          playExternalAudio(text, onEnded);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        playExternalAudio(text, onEnded);
      }
    }

    function playExternalAudio(text, onEnded) {
      const fallbackUrl = `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${encodeURIComponent(text.toLowerCase())}--_us_1.mp3`;
      const audio = new Audio(fallbackUrl);
      
      audio.onended = () => {
        if (onEnded) onEnded();
      };

      audio.play().catch(e => {
        const audio2 = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`);
        audio2.onended = () => {
          if (onEnded) onEnded();
        };
        audio2.play().catch(() => {
          if (onEnded) onEnded();
        });
      });
    }

    function startApp() {
      isSpellEnabled = document.getElementById("spellCheckOption").checked;
      loadVoices();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
      }

      document.getElementById("startBtn").style.display = "none";
      document.getElementById("optionArea").style.display = "none";
      document.getElementById("nextBtn").style.display = "inline-block";
      document.getElementById("backHomeBtn").style.display = "block";
      
      wordQueue = shuffle(wordList);
      nextQuestion();
    }

    // スタート画面に戻る関数
    function resetToHome() {
      clearAllTimers();

      document.getElementById("startBtn").style.display = "inline-block";
      document.getElementById("optionArea").style.display = "block";
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("backHomeBtn").style.display = "none";

      document.getElementById("secondary").textContent = "";
      updateUIByLanguage();
    }

    function nextQuestion() {
      clearAllTimers();
      setNextBtnEnabled(false);

      const primaryEl = document.getElementById("primary");
      const secondaryEl = document.getElementById("secondary");
      const modeEl = document.getElementById("mode");

      secondaryEl.textContent = "";

      const item = getNextWord();
      const mode = Math.random() < 0.5 ? 1 : 2;

      const isZh = (selectedLangMode === "zh-TW");
      const nativeMeaning = isZh ? item.tw : item.ja;
      const speakInstruction = isZh ? "請發音" : "発音して";
      const writeInstruction = isZh ? "請寫出英文拼字" : "英語の綴りを書いて";
      const label1 = isZh ? "英 ➔ 台" : "英 ➔ 日";
      const label2 = isZh ? "台 ➔ 英" : "日 ➔ 英";

      if (mode === 1) {
        // パターン(1): 英 ➔ 母国語
        modeEl.textContent = label1;
        
        // 英単語表示（上部）：青色（大）
        primaryEl.textContent = item.en;
        primaryEl.className = "primary-text color-blue";

        // 指示文言（下部）：赤色（通常サイズ）
        secondaryEl.textContent = speakInstruction;
        secondaryEl.className = "secondary-text color-red";

        currentTimeout = setTimeout(() => {
          // 母国語の意味表示（下部）：黒色（通常サイズ）
          secondaryEl.textContent = nativeMeaning;
          secondaryEl.className = "secondary-text color-black";

          speakWord(item.en, () => {
            setNextBtnEnabled(true);
          });
        }, 2000);

      } else {
        // パターン(2): 母国語 ➔ 英
        modeEl.textContent = label2;

        // 母国語の意味表示（上部）：黒色（大）
        primaryEl.textContent = nativeMeaning;
        primaryEl.className = "primary-text color-black";

        // 指示文言（下部）：赤色（通常サイズ）
        secondaryEl.textContent = writeInstruction;
        secondaryEl.className = "secondary-text color-red";

        currentTimeout = setTimeout(() => {
          // 英単語表示（下部）：青色 ＋ 大文字サイズ (.large-word)
          secondaryEl.textContent = item.en;
          secondaryEl.className = "secondary-text color-blue large-word";
          
          if (isSpellEnabled) {
            spellAndSpeak(item.en);
          } else {
            speakWord(item.en, () => {
              setNextBtnEnabled(true);
            });
          }
        }, 7000);
      }
    }
  </script>
</body>
</html>
