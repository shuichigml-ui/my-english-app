<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語アプリ (100語)Ver.0.42</title>
  <style>
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      width: 360px;
      min-height: 320px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .mode-label {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .primary-text {
      font-size: 2.8rem;
      font-weight: bold;
      margin-bottom: 20px;
      line-height: 1.2;
      word-break: break-word;
    }
    .secondary-text {
      font-size: 1.5rem;
      min-height: 2.2rem;
      line-height: 1.2;
      word-break: break-word;
    }

    /* 「日 ➔ 英」モード時の英単語拡大表示用クラス */
    .secondary-text.large-word {
      font-size: 2.8rem;
      font-weight: bold;
    }
    
    /* 色分け用クラス */
    .color-blue {
      color: #007bff !important; /* 英単語：青 */
    }
    .color-red {
      color: #d9534f !important; /* 指示：赤 */
      font-weight: bold;
    }
    .color-black {
      color: #222222 !important; /* それ以外（日本語の意味等）：黒 */
    }

    .notice-text {
      font-size: 0.8rem;
      color: #d9534f;
      margin-top: 15px;
      line-height: 1.4;
    }
    .option-container {
      margin-top: 15px;
      font-size: 0.95rem;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .option-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    .btn-group {
      margin-top: 25px;
      display: flex;
      gap: 12px;
    }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: bold;
      color: white;
      background-color: #007bff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }
    button:hover {
      background-color: #0056b3;
    }
    button:disabled {
      background-color: #ccc;
      color: #888;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="card">
    <div id="mode" class="mode-label">スタートボタンを押してください</div>
    <div id="primary" class="primary-text color-black">英単語アプリ (100語)Ver.0.42</div>
    <div id="secondary" class="secondary-text"></div>
    
    <div id="optionArea">
      <div class="option-container">
        <label>
          <input type="checkbox" id="spellCheckOption" checked>
          綴り（スペル）の音声を確認する
        </label>
      </div>
      <div class="notice-text">※ Android Chrome でのみ動作確認を行っています。</div>
    </div>

    <div class="btn-group">
      <button id="startBtn" onclick="startApp()">学習を開始する</button>
      <button id="nextBtn" onclick="nextQuestion()" style="display: none;" disabled>次へ ➔</button>
    </div>
  </div>

  <script>
    const wordList = [
      { en: "one", ja: "1つの、1人の" },
      { en: "the", ja: "その" },
      { en: "you", ja: "あなたは" },
      { en: "my", ja: "私の" },
      { en: "father", ja: "父" },
      { en: "do", ja: "する" },
      { en: "your", ja: "あなたの" },
      { en: "in", ja: "中に" },
      { en: "read", ja: "読む" },
      { en: "he", ja: "彼は" },
      { en: "see", ja: "見る、わかる" },
      { en: "it", ja: "それは" },
      { en: "mother", ja: "母" },
      { en: "name", ja: "名前" },
      { en: "like", ja: "好む" },
      { en: "how", ja: "どのぐらい" },
      { en: "school", ja: "学校" },
      { en: "January", ja: "1月" },
      { en: "all", ja: "全部、全員、全て、みな" },
      { en: "old", ja: "古い" },
      { en: "fruit", ja: "果物" },
      { en: "speak", ja: "話す" },
      { en: "where", ja: "どこに" },
      { en: "long", ja: "長い" },
      { en: "study", ja: "勉強する" },
      { en: "chair", ja: "いす" },
      { en: "very", ja: "非常に" },
      { en: "I", ja: "私は" },
      { en: "our", ja: "私たちの" },
      { en: "year", ja: "年" },
      { en: "when", ja: "いつ" },
      { en: "a lot of", ja: "たくさんの" },
      { en: "nice", ja: "良い" },
      { en: "sing", ja: "歌う" },
      { en: "fine", ja: "元気な" },
      { en: "right", ja: "右" },
      { en: "want", ja: "欲しい" },
      { en: "red", ja: "赤い" },
      { en: "much", ja: "たくさん" },
      { en: "here", ja: "ここに" },
      { en: "July", ja: "7月" },
      { en: "cold", ja: "冷たい" },
      { en: "write", ja: "書く、手紙を書く" },
      { en: "station", ja: "駅" },
      { en: "color", ja: "色" },
      { en: "this", ja: "この" },
      { en: "she", ja: "彼女は" },
      { en: "look", ja: "見る" },
      { en: "many", ja: "多くの" },
      { en: "two", ja: "2" },
      { en: "teacher", ja: "先生" },
      { en: "morning", ja: "朝" },
      { en: "use", ja: "使う" },
      { en: "run", ja: "走る" },
      { en: "hungry", ja: "空腹の" },
      { en: "fish", ja: "魚" },
      { en: "lunch", ja: "昼食" },
      { en: "have", ja: "持っている" },
      { en: "eat", ja: "食べる" },
      { en: "know", ja: "知っている" },
      { en: "usually", ja: "普通は" },
      { en: "season", ja: "季節" },
      { en: "book", ja: "本" },
      { en: "winter", ja: "冬" },
      { en: "stop", ja: "止める" },
      { en: "three", ja: "3" },
      { en: "pencil", ja: "鉛筆" },
      { en: "please", ja: "どうぞ" },
      { en: "wall", ja: "壁" },
      { en: "meet", ja: "会う" },
      { en: "May", ja: "5月" },
      { en: "ride", ja: "乗る" },
      { en: "six", ja: "6" },
      { en: "always", ja: "いつも" },
      { en: "drink", ja: "飲む" },
      { en: "four", ja: "4" },
      { en: "sister", ja: "姉妹" },
      { en: "hospital", ja: "病院" },
      { en: "park", ja: "公園" },
      { en: "baseball", ja: "野球" },
      { en: "wash", ja: "洗う" },
      { en: "cake", ja: "ケーキ" },
      { en: "bag", ja: "カバン" },
      { en: "Tuesday", ja: "火曜日" },
      { en: "try", ja: "試す" },
      { en: "cook", ja: "料理する" },
      { en: "watch", ja: "見る" },
      { en: "nurse", ja: "看護婦" },
      { en: "five", ja: "5" },
      { en: "seventeen", ja: "17" },
      { en: "table", ja: "つくえ" },
      { en: "place", ja: "場所" },
      { en: "cup", ja: "カップ" },
      { en: "green", ja: "緑" },
      { en: "we", ja: "私たちは" },
      { en: "fifty", ja: "50" },
      { en: "eleven", ja: "11" },
      { en: "picture", ja: "絵、写真" },
      { en: "happy", ja: "幸福な" },
      { en: "Thursday", ja: "木曜日" }
    ];

    let currentTimeout = null;
    let isSpellEnabled = true;
    let wordQueue = [];
    let bestEnglishVoice = null;

    function loadVoices() {
      if ('speechSynthesis' in window) {
        const voices = window.speechSynthesis.getVoices();
        bestEnglishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google')) ||
                           voices.find(v => v.lang.startsWith('en') && v.name.includes('Natural')) ||
                           voices.find(v => v.lang === 'en-US') ||
                           voices.find(v => v.lang.startsWith('en'));
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = loadVoices;
      loadVoices();
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getNextWord() {
      if (wordQueue.length === 0) {
        wordQueue = shuffle(wordList);
      }
      return wordQueue.pop();
    }

    function setNextBtnEnabled(enabled) {
      document.getElementById("nextBtn").disabled = !enabled;
    }

    function clearAllTimers() {
      if (currentTimeout) {
        clearTimeout(currentTimeout);
        currentTimeout = null;
      }
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
    }

    function speakWord(text, onEnded) {
      playSingleAudio(text, onEnded);
    }

    function spellAndSpeak(word) {
      const cleanWord = word.replace(/[^a-zA-Z]/g, '');
      const letters = cleanWord.split('');

      if ('speechSynthesis' in window && letters.length > 0) {
        window.speechSynthesis.cancel();

        let index = 0;

        function speakNextLetter() {
          if (index < letters.length) {
            const letter = letters[index];
            index++;

            const utterance = new SpeechSynthesisUtterance(letter);
            utterance.lang = 'en-US';
            utterance.rate = 1.0;
            if (bestEnglishVoice) utterance.voice = bestEnglishVoice;

            utterance.onend = () => {
              currentTimeout = setTimeout(speakNextLetter, 100);
            };

            utterance.onerror = () => {
              currentTimeout = setTimeout(speakNextLetter, 100);
            };

            window.speechSynthesis.speak(utterance);

          } else {
            currentTimeout = setTimeout(() => {
              speakWord(word, () => {
                setNextBtnEnabled(true);
              });
            }, 1500);
          }
        }

        speakNextLetter();

      } else {
        speakWord(word, () => {
          setNextBtnEnabled(true);
        });
      }
    }

    function playSingleAudio(text, onEnded) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        utterance.rate = 0.9;
        if (bestEnglishVoice) utterance.voice = bestEnglishVoice;

        utterance.onend = () => {
          if (onEnded) onEnded();
        };

        utterance.onerror = () => {
          playExternalAudio(text, onEnded);
        };

        window.speechSynthesis.speak(utterance);
      } else {
        playExternalAudio(text, onEnded);
      }
    }

    function playExternalAudio(text, onEnded) {
      const fallbackUrl = `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${encodeURIComponent(text.toLowerCase())}--_us_1.mp3`;
      const audio = new Audio(fallbackUrl);
      
      audio.onended = () => {
        if (onEnded) onEnded();
      };

      audio.play().catch(e => {
        const audio2 = new Audio(`https://dict.youdao.com/dictvoice?audio=${encodeURIComponent(text)}&type=2`);
        audio2.onended = () => {
          if (onEnded) onEnded();
        };
        audio2.play().catch(() => {
          if (onEnded) onEnded();
        });
      });
    }

    function startApp() {
      isSpellEnabled = document.getElementById("spellCheckOption").checked;
      loadVoices();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.speak(new SpeechSynthesisUtterance(""));
      }

      document.getElementById("startBtn").style.display = "none";
      document.getElementById("optionArea").style.display = "none";
      document.getElementById("nextBtn").style.display = "inline-block";
      
      wordQueue = shuffle(wordList);
      nextQuestion();
    }

    function nextQuestion() {
      clearAllTimers();
      setNextBtnEnabled(false);

      const primaryEl = document.getElementById("primary");
      const secondaryEl = document.getElementById("secondary");
      const modeEl = document.getElementById("mode");

      secondaryEl.textContent = "";

      const item = getNextWord();
      const mode = Math.random() < 0.5 ? 1 : 2;

      if (mode === 1) {
        // パターン(1): 英 ➔ 日
        modeEl.textContent = "英 ➔ 日";
        
        // 英単語表示（上部）：青色（大）
        primaryEl.textContent = item.en;
        primaryEl.className = "primary-text color-blue";

        // 指示文言（下部）：赤色（通常サイズ）
        secondaryEl.textContent = "発音して";
        secondaryEl.className = "secondary-text color-red";

        currentTimeout = setTimeout(() => {
          // 日本語意味表示（下部）：黒色（通常サイズ）
          secondaryEl.textContent = item.ja;
          secondaryEl.className = "secondary-text color-black";

          speakWord(item.en, () => {
            setNextBtnEnabled(true);
          });
        }, 2000);

      } else {
        // パターン(2): 日 ➔ 英
        modeEl.textContent = "日 ➔ 英";

        // 日本語の意味表示（上部）：黒色（大）
        primaryEl.textContent = item.ja;
        primaryEl.className = "primary-text color-black";

        // 指示文言（下部）：赤色（通常サイズ）
        secondaryEl.textContent = "英語の綴りを書いて";
        secondaryEl.className = "secondary-text color-red";

        currentTimeout = setTimeout(() => {
          // 英単語表示（下部）：青色 ＋ 大文字サイズ (.large-word)
          secondaryEl.textContent = item.en;
          secondaryEl.className = "secondary-text color-blue large-word";
          
          if (isSpellEnabled) {
            spellAndSpeak(item.en);
          } else {
            speakWord(item.en, () => {
              setNextBtnEnabled(true);
            });
          }
        }, 7000);
      }
    }
  </script>
</body>
</html>
